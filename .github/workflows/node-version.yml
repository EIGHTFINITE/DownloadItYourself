name: "Update Node"

on:
  schedule:
    - cron: '0 0 * * *'

permissions: write-all

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: "Node"
      shell: bash
      run: |
        bash --noprofile --norc -e -o pipefail .github/workflows/git-config.sh
        node_version=$(curl -sS "https://api.github.com/repos/nodejs/node/releases/latest" | python -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")
        echo "$node_version"
        node_version=${node_version:1}
        echo "$node_version"
        sed -i "0,/\"node\": \".*\"/s//\"node\": \"$node_version\"/" package.json
        git add package.json
        git -c user.name="GitHub" -c user.email="noreply@github.com" commit --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" -m"Update Node to $node_version" || true
        echo "node_version=$node_version" >> $GITHUB_ENV
    - id: cpr
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Update Node to ${{ env.node_version }}"
        author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        committer: GitHub <noreply@github.com>
        title: "Update Node to ${{ env.node_version }}"
        body: |
          Update Node to the latest version found on https://github.com/nodejs/node/releases/latest
          
          Changelog: https://github.com/nodejs/node/blob/main/CHANGELOG.md
        labels: |
          automerge
        branch: actions/node
        base: master
    - name: get repository name
      if: ${{ steps.cpr.outputs.pull-request-number }}
      shell: bash
      run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
    - name: automerge
      if: ${{ steps.cpr.outputs.pull-request-number }}
      uses: actions/github-script@v9.0.0
      with:
        script: |
          github.rest.pulls.merge({
            owner: '${{ github.repository_owner }}',
            repo: '${{ env.REPOSITORY_NAME }}',
            pull_number: '${{ steps.cpr.outputs.pull-request-number }}',
            sha: '${{ steps.cpr.outputs.pull-request-head-sha }}',
            merge_method: 'merge'
          })
